[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yt-transcriber"
version = "1.0.0"
description = "Extract YouTube transcripts (single videos, playlists, batches) with a local Whisper fallback for videos without captions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Barreca" }]
keywords = ["youtube", "transcript", "subtitles", "captions", "whisper", "srt", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp[default]>=2025.1.1",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.1",
    # PyAV 19 removed the `metadata_errors` argument that faster-whisper 1.2.1
    # passes to av.open(); drop this cap once faster-whisper supports it.
    "av>=11,<19",
]
dev = ["pytest>=8"]

[project.scripts]
yt-transcript = "yt_transcriber.transcript:main"
yt-playlist = "yt_transcriber.playlist:main"

[project.urls]
Homepage = "https://github.com/diego-barreca-2004/YT-Transcriber"
Issues = "https://github.com/diego-barreca-2004/YT-Transcriber/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
