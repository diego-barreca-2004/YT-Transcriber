name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.extras == 'dev' && ' (no Whisper)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        extras: ["whisper,dev"]
        include:
          # The core install must work without the optional Whisper dependencies.
          - os: ubuntu-latest
            python: "3.13"
            extras: "dev"
          - os: windows-latest
            python: "3.13"
            extras: "dev"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]"

      - name: Test
        run: python -m pytest -v

      - name: Check the command-line entry points
        run: |
          yt-transcript --version
          yt-playlist --version
          python -m yt_transcriber --help
